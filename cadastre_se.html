<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/Section.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/cadastre_se.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cadastro</title>
</head>

<body>
    <section class="cadastro">
        <div class="container">

            <div class="form">
                <img src="./img/nome_Krooq_verde.png" alt="Logo Krooq" class="logo">

                <h1>Cadastre-se</h1>
                <p>Bem-vindo de volta! Por favor, insira seus dados.</p>

                <form>
                    <label for="nome">Nome</label>
                    <input type="text" placeholder="Digite seu nome" id="nome">

                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" placeholder="Digite seu sobrenome" id="sobrenome">

                    <label for="senha">Senha</label>
                    <input type="password" placeholder="Crie uma senha" id="senha">

                    <label for="confirmeSenha">Confirme senha</label>
                    <input type="password" placeholder="Digite sua senha" id="confirmeSenha">

                    <div class="termos">
                        <input type="checkbox" id="termos">
                        <label for="termos">
                            Aceitar termos e condições e <span>política de privacidade</span>
                        </label>
                    </div>

                    <div class="botao">
                        <button type="submit" class="btn-cadastrar"> Cadastrar agora</button>
                        <button  type="button" class="btn-google"> <i class="fa-brands fa-google"></i> Entrar com o Google</button>
                    </div>

                    <span class="login">Não tem uma conta? <a href="#">Entrar</a></span>
                </form>
            </div>

            <div class="img">
                <img src="./img/krooq_cadastre_se.png" alt="Imagem Krooq">
            </div>

        </div>
    </section>
</body>

</html>
